<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000005" />
    <title>Deep Dive</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <div id="hud">
        <div id="readout">
          <div id="depth">Sea level</div>
          <div id="zone"></div>
        </div>
        <button id="book-btn" type="button">Book 0/0</button>
        <div id="scalebar"><div id="scalebar-line"></div><span id="scalebar-label"></span></div>
        <div id="zoom">
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
          <button id="zoom-fit" type="button" aria-label="Zoom out to the largest nearby object" title="Zoom out to the largest nearby object">&#x2922;</button>
          <button id="peaks-btn" type="button" aria-label="Height profiles: Everest, Mauna Kea, Mauna Loa" title="Height profiles: Everest, Mauna Kea, Mauna Loa">&#x26F0;&#xFE0F;</button>
          <button id="zoom-earth" type="button" aria-label="Show the whole Earth" title="Show the whole Earth">&#x1F30D;</button>
        </div>
        <div id="minimap"><canvas id="minimap-canvas" aria-label="Overview map: click to jump"></canvas></div>
        <div id="hint">Tap a circle to zoom in. Scroll or pinch to zoom, click the map to travel.</div>
        <div id="card" hidden>
          <div id="card-badge"></div>
          <h2 id="card-name"></h2>
          <div id="card-range"></div>
          <p id="card-fact"></p>
        </div>
      </div>
      <div id="peaks" hidden>
        <div id="peaks-head"><h1>Height profiles</h1><button id="peaks-close" type="button">Close</button></div>
        <p>How tall is a mountain? It depends on where you start measuring.</p>
        <div id="peaks-measures"></div>
        <p id="peaks-blurb"></p>
        <canvas id="peaks-canvas" aria-label="Profiles of Mount Everest, Mauna Kea and Mauna Loa on one vertical scale"></canvas>
        <p class="peak-note">Heights are sourced and drawn on one true vertical scale. Widths and flank shapes are schematic and not to scale.</p>
        <ol id="peaks-rank"></ol>
        <div id="peaks-cards"></div>
      </div>
      <div id="book" hidden>
        <div id="book-head"><h1>Collection</h1><button id="book-close" type="button">Close</button></div>
        <div id="book-grid"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
